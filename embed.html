<!--
  US Midterms 2026 results — embed code
  Easiest: open the results page and press "</> Embed" on the section you want; it builds this code for you.

  Paste one block into the article (WordPress: Custom HTML block, or the Text tab).
  Options in the src:
    part=boards | map | table   one section only (leave out for the whole page)
    tabs=0                      hide the Senate / House / Governor switch
    #senate | #house | #governor  which office to open on (not used for boards)
  Several embeds can sit on the same article; each block sizes its own frame.
-->

<!-- Whole page -->
<div class="us-midterms-embed">
<iframe src="https://surakittw-oss.github.io/us-midterms/?embed=1#senate" title="US midterm elections 2026: Full results page" style="display:block;width:100%;height:1500px;border:0;overflow:hidden" scrolling="no" loading="lazy"></iframe>
<script>
(function(){var f=document.currentScript.parentNode.querySelector('iframe');
window.addEventListener('message',function(e){
if(e.origin!=='https://surakittw-oss.github.io'||e.source!==f.contentWindow)return;
var d=e.data;if(d&&d.type==='us-midterms:height'&&d.height>0)f.style.height=d.height+'px';});})();
</script>
</div>
